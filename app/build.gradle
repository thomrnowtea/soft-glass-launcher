plugins {
    id 'com.android.application'
}

def launcherId = providers.gradleProperty('launcherApplicationId').getOrElse('com.softglass.launcher')
def continuity = launcherId == 'com.gathin.tvhome'
def signingPropertiesFile = file(providers.gradleProperty('softglassSigningProperties').getOrElse('../../backups/softglass-signing/signing.properties'))
def distributionKey = new Properties()
def distributionConfigured = !continuity && signingPropertiesFile.isFile()
if (distributionConfigured) {
    signingPropertiesFile.withInputStream { distributionKey.load(it) }
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // The public APK uses its own identity; see DISTRIBUTION.md for alternate builds.
        applicationId launcherId
        minSdk 26
        targetSdk 34
        versionCode continuity ? 6 : 1
        versionName '4.0.0'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        distribution {
            if (distributionConfigured) {
                storeFile file(distributionKey.getProperty('storeFile'))
                storePassword distributionKey.getProperty('storePassword')
                keyAlias distributionKey.getProperty('keyAlias')
                keyPassword distributionKey.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Existing TV keeps its signer and identity. The distributable has a separate stable key.
            signingConfig continuity ? signingConfigs.debug : (distributionConfigured ? signingConfigs.distribution : null)
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// A clean clone can build debug APKs without the publisher's private release key.
tasks.configureEach { task ->
    if (!continuity && !distributionConfigured && task.name == 'preReleaseBuild') {
        task.doFirst {
            throw new GradleException('Release signing is not configured. Supply -PsoftglassSigningProperties=<file>; debug builds need no release key. See DISTRIBUTION.md.')
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
